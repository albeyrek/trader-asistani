# KAP bildirim arşivi: olay çalışması (bedelsiz, geri alım, temettü, yeni iş... sonrası fiyat) için 2016'dan bugüne.
# KAP'ı yormamak için yavaş ilerler (istekler arası 3 sn) ve süre sınırında kaydedip durur; ertesi gün kaldığı yerden
# devam eder. Arşiv tamamlanınca her gün sadece yeni günleri ekler. Veri, günlük taramanın önbelleğinde tutulur.
# 04:30 UTC = 07:30 TR (piyasalar kapalı, günlük tarama ile çakışmaz).
name: KAP arsivi

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Onceki veriyi geri yukle
        uses: actions/cache@v4
        with:
          path: backend/data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: KAP arsivi
        run: python -m scanner.kap_history --start 2016-11-01 --pause 3 --budget-min 110

      - name: Olay calismasi
        run: python -m scanner.kap_events || echo "olay çalışması için henüz yeterli arşiv yok"
