# Her push ve PR'da otomatik kontroller: hesap mantığı testleri, tip denetimi, kod denetimi.
# Bir değişiklik çıkış kurallarını, sanal portföyü, gündem kurallarını ya da sohbetin hisse tespitini bozarsa
# burada kırmızı görünür (günlük taramaya ulaşmadan).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Kod denetimi (pyflakes)
        run: python -m pyflakes scanner api tests
      - name: Birim testleri
        run: python -m pytest -q tests

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Tip denetimi
        run: npx tsc --noEmit
      # parity (JS/Python sınıflandırıcı karşılaştırması) yerel haber verisinden üretilen örneklere ihtiyaç duyar
      # (test/fixture.json depoda değil); yerelde çalıştırılır: npm run parity
      - name: Testler
        run: |
          for t in assistant agenda chat health plans prices; do
            echo "::group::$t"; npx tsx "test/$t.ts"; echo "::endgroup::"
          done

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Tip denetimi
        run: npx tsc --noEmit
      - name: Kod denetimi (eslint)
        run: npx expo lint
