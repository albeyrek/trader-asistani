name = "trader-asistani"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
DATA_URL = "https://albeyrek.github.io/trader-asistani/data"

# Cihazlar ve görülen haberler (ücretsiz KV: günde 100 bin okuma, 1000 yazma)
[[kv_namespaces]]
binding = "KV"
id = "23435a86d35245a0888123dc7c3a5b1e"

# 1) Haber bekçisi: 5 dakikada bir
# 2) Gün içi fiyat alarmları: hafta içi 07-21 UTC (BIST 10:00-18:10, ABD 16:30-24:00 TR) 5 dakikada bir
#    (ifade src/index.ts içindeki PRICE_CRON ile aynı olmalı)
# 3) Asistan: 10 dakikada bir yeni aday listesi için yapay zekâ yorumu ve liste bildirimi (ASSISTANT_CRON)
[triggers]
crons = ["*/5 * * * *", "*/5 7-21 * * 1-5", "2-59/10 * * * *"]

# Workers AI: asistan yorumları (ücretsiz plan: günde 10.000 neuron)
[ai]
binding = "AI"
